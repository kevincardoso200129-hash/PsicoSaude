<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PsicoSaúde NR-1</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f7fb;--card:#fff;--ink:#10182b;--muted:#667085;--line:#dbe4ee;--blue:#12385a;--teal:#087e8b;--green:#0f7a4b;--red:#9b1c1f;--warn:#9a5b12;--soft:#eef6ff;--r:24px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,#eef4fb);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:22px 22px 14px}h1{font-size:clamp(32px,8vw,54px);line-height:1.05;margin:8px 0 22px}.eyebrow{color:var(--muted);font-size:16px}.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.tab{border:0;border-radius:999px;background:#eef3f8;padding:13px 18px;font-size:18px;white-space:nowrap}.tab.on{background:#dff7e9;color:#11623b;font-weight:800;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}main{max-width:980px;margin:auto;padding:24px 18px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 45px rgba(16,24,40,.08);padding:28px;margin:0 0 22px}.card h2{font-size:clamp(30px,7vw,48px);line-height:1.08;margin:0 0 16px}.card h3{font-size:26px;margin:0 0 12px}.muted{color:var(--muted)}.btn{appearance:none;border:0;border-radius:18px;background:var(--blue);color:white;padding:16px 22px;font-size:18px;font-weight:800;margin:8px 8px 8px 0;cursor:pointer}.btn.alt{background:#edf3f9;color:var(--ink)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:16px;padding:15px;font-size:17px;margin:8px 0 14px;background:white}textarea{min-height:90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.pill{display:inline-block;background:#eef4fb;border:1px solid var(--line);border-radius:999px;padding:8px 12px;margin:4px}.notice{background:#edf7ff;border:1px solid #b8d7ff;border-radius:18px;padding:18px;color:#173b68}.warn{background:#fff8e8;border-color:#f0d18a;color:#74430d}.risk{font-size:42px;font-weight:900}.badge{display:inline-block;border-radius:999px;padding:7px 12px;color:#fff;font-weight:800}.baixo{background:#0f7a4b}.moderado{background:#9a5b12}.alto,.critico{background:#9b1c1f}.q{padding:18px;border:1px solid var(--line);border-radius:18px;margin:14px 0;background:#fff}.scale{display:flex;gap:7px;flex-wrap:wrap}.scale label{flex:1;min-width:46px;text-align:center;border:1px solid var(--line);border-radius:14px;padding:11px;background:#f7fafc}.scale input{width:auto;margin:0 4px 0 0}.course-frame{width:100%;min-height:600px;border:1px solid var(--line);border-radius:18px;background:white}.hidden{display:none!important}.small{font-size:14px}.hr{height:1px;background:var(--line);margin:24px 0}.ok{color:var(--green);font-weight:800}.err{color:var(--red);font-weight:800}.table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:16px}.table th,.table td{border:1px solid var(--line);padding:12px;text-align:left}.table th{background:#eef4fb}@media(max-width:560px){header{padding:20px 18px 12px}.card{padding:22px}.tab{font-size:17px;padding:12px 16px}.btn{width:100%;margin-right:0}.scale label{min-width:56px}}
</style>
</head>
<body>
<header>
 <div class="eyebrow">Sistema online • Supabase • NR-1</div>
 <h1>Saúde psicossocial, NR-1 e desenvolvimento</h1>
 <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>
<script>
const SUPABASE_URL='https://zikbeixejgdbtlsqundn.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Inppa2JlaXhlamdkYnRsc3F1bmRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NzI0ODgsImV4cCI6MjA5NjI0ODQ4OH0.QjQtzm0uyZ1MK39lfLlRzoXtJvxoxckHGzIHIxlLpAY'.replace('JIUzI1NiIsInJlZiI6','I1NiIsInJlZiI6');
const ORG='00000000-0000-0000-0000-000000000001';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
let session=null, user=null, profile=null, page='inicio', qs=[], qsQuestions={}, activeCourse=null;
const app=document.getElementById('app'), tabs=document.getElementById('tabs');
const TABS_COL=[['inicio','Início'],['perfil','Meu Perfil'],['questionarios','Questionários'],['devolutiva','Devolutiva'],['trilhas','Minhas Trilhas'],['talentos','Perfil Profissional'],['oportunidades','Oportunidades'],['apoio','Canal de Apoio']];
const TABS_GEST=[['inicio','Dashboard'],['colaboradores','Colaboradores'],['cursos','Cursos'],['participacao','Participação'],['talentosgestao','Banco de Talentos'],['relatorio','Relatório']];
function html(s){app.innerHTML=s}function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function arr(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean)}
function setPage(p){page=p;render()}function isStaff(){return profile&&['super_admin','org_admin','manager','consultant'].includes(profile.role)}
async function init(){let r=await sb.auth.getSession();session=r.data.session;user=session?.user||null;if(user)await loadProfile();render()}init();
async function loadProfile(){let r=await sb.from('profiles').select('*').eq('user_id',user.id).maybeSingle();if(!r.data)r=await sb.from('profiles').select('*').eq('auth_user_id',user.id).maybeSingle();profile=r.data;if(!profile)alert('Usuário sem perfil no sistema.')} 
function drawTabs(){let list=!profile?[]:(isStaff()?TABS_GEST:TABS_COL);tabs.innerHTML=list.map(t=>`<button class="tab ${page==t[0]?'on':''}" onclick="setPage('${t[0]}')">${t[1]}</button>`).join('')+(profile?`<button class="tab" onclick="logout()">Sair</button>`:'')}
async function logout(){await sb.auth.signOut();session=user=profile=null;page='inicio';render()}
function render(){drawTabs(); if(!user)return login(); if(!profile)return html('<section class="card"><h2>Perfil não localizado</h2><p>O usuário existe no Auth, mas não tem registro em profiles.</p></section>'); return isStaff()?renderGestao():renderColab()}
function login(){html(`<section class="card"><h2>Entrar no PsicoSaúde</h2><p class="muted">Use os usuários cadastrados no Supabase Auth.</p><label>E-mail</label><input id="email" autocomplete="email" placeholder="seu@email.com"><label>Senha</label><input id="senha" type="password" autocomplete="current-password" placeholder="Senha"><button class="btn" onclick="doLogin()">Entrar</button><div class="notice"><b>Teste:</b><br>gestao.teste@psicosaude.com<br>colaborador.teste@psicosaude.com</div></section>`) }
async function doLogin(){let email=document.getElementById('email').value.trim(), password=document.getElementById('senha').value;let r=await sb.auth.signInWithPassword({email,password});if(r.error)return alert(r.error.message);session=r.data.session;user=r.data.user;await loadProfile();page='inicio';render()}
function renderColab(){({inicio:homeCol,perfil:perfil,questionarios:questionarios,devolutiva:devolutiva,trilhas:trilhas,talentos:talentos,oportunidades:oportunidades,apoio:apoio}[page]||homeCol)()}
function homeCol(){html(`<section class="card"><h2>Olá, ${esc(profile.full_name)}</h2><p class="muted">Sua jornada de cuidado, desenvolvimento e participação está disponível abaixo.</p><button class="btn" onclick="setPage('questionarios')">Responder questionários</button><button class="btn alt" onclick="setPage('trilhas')">Acessar trilhas</button></section><section class="card notice"><b>Privacidade:</b> suas respostas psicossociais são usadas para devolutiva individual e indicadores agregados. A gestão não acessa respostas individuais sensíveis.</section>`) }
function perfil(){html(`<section class="card"><h2>Meu Perfil</h2><p><b>Nome:</b> ${esc(profile.full_name)}</p><p><b>E-mail:</b> ${esc(profile.email)}</p><p><b>Função atual:</b> ${esc(profile.function_title||profile.position_title||'—')}</p><p><b>Perfil:</b> ${esc(profile.role)}</p><div class="notice"><b>Privacidade:</b> suas respostas psicossociais ficam vinculadas apenas ao seu perfil e não são exibidas individualmente à gestão.</div></section>`) }
async function loadQuestionarios(){let rq=await sb.from('questionnaires').select('*').eq('organization_id',profile.organization_id||ORG).eq('is_active',true).order('name'); if(rq.error){rq=await sb.from('questionnaires').select('*').eq('is_active',true).order('name')}qs=rq.data||[]; for(const q of qs){let x=await sb.from('questions').select('*').eq('questionnaire_id',q.id).order('sort_order'); qsQuestions[q.id]=x.data||[]}}
async function questionarios(){if(!qs.length)await loadQuestionarios();html(`<section class="card"><h2>Questionários</h2><p class="muted">Responda aos instrumentos disponíveis. Não possuem finalidade diagnóstica individual.</p>${qs.map(q=>`<div class="q"><h3>${esc(q.name)}</h3><p>${esc(q.description||'')}</p><button class="btn" onclick="abrirQuest('${q.id}')">Responder</button></div>`).join('')}</section>`)}
function abrirQuest(id){let q=qs.find(x=>x.id==id), perguntas=qsQuestions[id]||[];html(`<section class="card"><h2>${esc(q.name)}</h2><p class="muted">${esc(q.scale||'')}</p>${perguntas.map((p,i)=>`<div class="q"><b>${i+1}. ${esc(p.text)}</b><div class="scale">${[0,1,2,3,4,5].filter(v=>v<=Number(p.max_value||5)&&(Number(p.max_value)==3||v>0)).map(v=>`<label><input type="radio" name="${p.id}" value="${v}">${v}</label>`).join('')}</div></div>`).join('')}<button class="btn green" onclick="salvarQuest('${id}')">Salvar respostas</button><button class="btn alt" onclick="setPage('questionarios')">Voltar</button></section>`)}
async function cicloAtivo(){let r=await sb.from('assessment_cycles').select('*').eq('organization_id',profile.organization_id||ORG).in('status',['active','open']).order('created_at',{ascending:false}).limit(1).maybeSingle();return r.data}
async function salvarQuest(qid){let perguntas=qsQuestions[qid]||[], ciclo=await cicloAtivo(); if(!ciclo)return alert('Não encontrei ciclo ativo.');let payload=[];for(const p of perguntas){let el=document.querySelector(`input[name="${p.id}"]:checked`);if(!el)return alert('Responda todas as perguntas.');payload.push({organization_id:profile.organization_id||ORG,cycle_id:ciclo.id,profile_id:profile.id,unit_id:profile.unit_id||null,questionnaire_id:qid,question_id:p.id,dimension:p.dimension,value:Number(el.value)})}let r=await sb.from('psychosocial_responses').upsert(payload,{onConflict:'cycle_id,profile_id,question_id'});if(r.error)return alert('Erro ao salvar: '+r.error.message);alert('Respostas salvas.');page='devolutiva';render()}
async function devolutiva(){let ciclo=await cicloAtivo();let r=await sb.from('psychosocial_responses').select('dimension,value,questions(risk_direction,max_value)').eq('profile_id',profile.id).eq('cycle_id',ciclo?.id||'00000000-0000-0000-0000-000000000000');let rows=r.data||[];let map={};rows.forEach(x=>{let max=x.questions?.max_value||5, val=x.value;if(x.questions?.risk_direction=='reverse')val=max+1-val;let pct=Math.round((val/max)*100);(map[x.dimension] ||= []).push(pct)});let cards=Object.entries(map).map(([d,a])=>{let pct=Math.round(a.reduce((s,v)=>s+v,0)/a.length), lv=pct>=80?'critico':pct>=60?'alto':pct>=40?'moderado':'baixo';return `<div class="card"><h3>${esc(d)}</h3><div class="risk">${pct}%</div><span class="badge ${lv}">${lv.toUpperCase()}</span></div>`}).join('');html(`<section class="card"><h2>Minha Devolutiva</h2><p class="muted">Resumo dos seus riscos psicossociais respondidos. Não é diagnóstico clínico.</p></section>${cards||'<section class="card"><p>Nenhuma resposta encontrada ainda.</p></section>'}`)}
async function trilhas(){let r=await sb.from('courses').select('*').eq('organization_id',profile.organization_id||ORG).eq('is_active',true).order('sort_order');let courses=r.data||[];html(`<section class="card"><h2>Minhas Trilhas</h2><p class="muted">Cursos recomendados para desenvolvimento e prevenção.</p></section>${courses.map(c=>`<section class="card"><p class="muted">${esc(c.category||'Curso')}</p><h2>${esc(c.title)}</h2><p>${esc(c.description||'')}</p><p><b>${esc(c.duration||'')}</b></p><ul>${(c.modules||[]).map(m=>`<li>${esc(m)}</li>`).join('')}</ul><button class="btn" onclick="abrirCurso('${c.id}')">Abrir aula</button><button class="btn green" onclick="concluirCurso('${c.id}',80)">Registrar conclusão no PsicoSaúde</button></section>`).join('')}`)}
async function abrirCurso(id){let r=await sb.from('courses').select('*').eq('id',id).maybeSingle();let c=r.data; if(!c?.content_url)return alert('Curso sem URL.');activeCourse=c;let txt=await fetch(c.content_url).then(x=>x.text()).catch(()=>null); if(!txt)return alert('Não consegui abrir o curso.');txt=txt.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<button[^>]*>\s*Verificar respostas\s*<\/button>/gi,'').replace(/<section class="section"[^>]*id="quiz"[\s\S]*?<\/section>/gi,'');html(`<section class="card"><button class="btn alt" onclick="setPage('trilhas')">Voltar às trilhas</button><h2>${esc(c.title)}</h2><div class="notice warn"><b>Conclusão:</b> após estudar a aula, use o botão verde abaixo para registrar a conclusão no PsicoSaúde.</div></section><section class="card">${txt}</section><section class="card"><h2>Concluir curso no PsicoSaúde</h2><p>Confirme a participação após realizar a aula. Esta confirmação registra a conclusão no sistema.</p><button class="btn green" onclick="concluirCurso('${c.id}',80)">Registrar conclusão no PsicoSaúde</button></section>`); window.scrollTo(0,0)}
async function concluirCurso(courseId,score){let payload={organization_id:profile.organization_id||ORG,course_id:courseId,profile_id:profile.id,status:'completed',progress:100,progress_percent:100,score_percent:score,started_at:new Date().toISOString(),completed_at:new Date().toISOString(),last_accessed_at:new Date().toISOString(),attempts:1,quiz_payload:{source:'psicosaude',score}};let r=await sb.from('course_enrollments').upsert(payload,{onConflict:'profile_id,course_id'});if(r.error)return alert('Não consegui registrar o curso no Supabase: '+r.error.message);alert('Curso concluído e registrado no PsicoSaúde.');setPage('trilhas')}
async function talentos(){let r=await sb.from('talent_profiles').select('*').eq('profile_id',profile.id).maybeSingle();let t=r.data||{};html(`<section class="card"><h2>Meu Perfil Profissional</h2><p class="muted">Preencha para melhorar a aderência com oportunidades internas.</p><label>Interesses</label><input id="interesses" value="${esc((t.interests||[]).join(', '))}" placeholder="Ex: liderança, comunicação, atendimento"><label>Competências</label><input id="skills" value="${esc((t.skills||[]).join(', '))}" placeholder="Ex: escuta, Excel, gestão de conflitos"><label>Formação</label><input id="education" value="${esc(t.education||'')}"><label>Resumo profissional</label><textarea id="summary">${esc(t.professional_summary||t.dreams||'')}</textarea><button class="btn green" onclick="salvarTalento()">Salvar perfil profissional</button></section>`)}
async function salvarTalento(){let payload={profile_id:profile.id,organization_id:profile.organization_id||ORG,interests:arr(document.getElementById('interesses').value),skills:arr(document.getElementById('skills').value),education:document.getElementById('education').value,professional_summary:document.getElementById('summary').value,updated_at:new Date().toISOString()};let r=await sb.from('talent_profiles').upsert(payload,{onConflict:'profile_id'});if(r.error)return alert(r.error.message);alert('Perfil profissional salvo.');}
function oportunidades(){html(`<section class="card"><h2>Oportunidades Internas</h2><p class="muted">Vagas e possibilidades internas aparecerão aqui conforme cadastro da gestão.</p><div class="notice warn"><b>Banco de talentos:</b> preencha seu perfil profissional para calcular aderência.</div></section><section class="card"><table class="table"><tr><th>Serviço</th><th>Função</th></tr><tr><td>Vila Reencontro</td><td>Coordenador 40h</td></tr><tr><td>Administrativo</td><td>Analista de RH</td></tr></table></section>`)}
function apoio(){html(`<section class="card"><h2>Canal de Apoio</h2><p>Registre uma demanda, dúvida ou pedido de apoio.</p><label>Categoria</label><select id="cat"><option>Acolhimento</option><option>Comunicação</option><option>Conflito</option><option>Discriminação/assédio</option></select><label>Relato</label><textarea id="relato"></textarea><button class="btn green" onclick="salvarApoio()">Enviar</button></section>`)}
async function salvarApoio(){let payload={organization_id:profile.organization_id||ORG,unit_id:profile.unit_id||null,profile_id:profile.id,category:document.getElementById('cat').value,description:document.getElementById('relato').value,status:'aberto'};let r=await sb.from('ombudsman_reports').insert(payload);if(r.error)return alert(r.error.message);alert('Relato enviado.')} 
function renderGestao(){({inicio:dash,colaboradores:colaboradores,cursos:cursosGestao,participacao:participacao,talentosgestao:talentosGestao,relatorio:relatorio}[page]||dash)()}
async function dash(){let r=await sb.from('vw_risk_by_organization').select('*');html(`<section class="card"><h2>Dashboard da Gestão</h2><p class="muted">Indicadores agregados. Dados individuais sensíveis não são exibidos.</p></section><section class="card"><pre>${esc(JSON.stringify(r.data||[],null,2))}</pre></section>`)}
async function colaboradores(){let r=await sb.from('profiles').select('full_name,email,role,is_active,function_title,position_title').eq('organization_id',profile.organization_id||ORG).order('full_name');html(`<section class="card"><h2>Colaboradores</h2><table class="table"><tr><th>Nome</th><th>Email</th><th>Perfil</th></tr>${(r.data||[]).map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.email)}</td><td>${esc(p.role)}</td></tr>`).join('')}</table></section>`)}
async function cursosGestao(){let r=await sb.from('courses').select('*').eq('organization_id',profile.organization_id||ORG).order('sort_order');html(`<section class="card"><h2>Cursos</h2>${(r.data||[]).map(c=>`<div class="q"><h3>${esc(c.title)}</h3><p>${esc(c.category||'')} • ${esc(c.duration||'')}</p></div>`).join('')}</section>`)}
async function participacao(){let r=await sb.from('course_enrollments').select('status,score_percent,completed_at,profiles(full_name,email),courses(title)').order('completed_at',{ascending:false});html(`<section class="card"><h2>Participação em Cursos</h2><table class="table"><tr><th>Colaborador</th><th>Curso</th><th>Status</th><th>Nota</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.profiles?.full_name)}</td><td>${esc(x.courses?.title)}</td><td>${esc(x.status)}</td><td>${esc(x.score_percent||'')}</td></tr>`).join('')}</table></section>`)}
async function talentosGestao(){let r=await sb.from('talent_profiles').select('*,profiles(full_name,email)');html(`<section class="card"><h2>Banco de Talentos</h2>${(r.data||[]).map(t=>`<div class="q"><h3>${esc(t.profiles?.full_name)}</h3><p><b>Interesses:</b> ${(t.interests||[]).map(esc).join(', ')}</p><p><b>Competências:</b> ${(t.skills||[]).map(esc).join(', ')}</p></div>`).join('')||'<p>Nenhum perfil profissional preenchido.</p>'}</section>`)}
async function relatorio(){let r=await sb.from('psychosocial_responses').select('dimension,value');let total=(r.data||[]).length;html(`<section class="card"><h2>Relatório Básico do Ciclo</h2><p>Total de respostas registradas: <b>${total}</b></p><p class="muted">Use este relatório como base inicial para o Pacote Plus e plano de ação consultivo.</p></section>`)}
</script>
</body>
</html>
